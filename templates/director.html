{%extends "layout.html"%}
{% block main %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{directorName}}</title>
    </head>
    <style>
        .wrapperDiv{
            display: flex;
            height: 100vh;
        }
        .movieList{
            display: flex;
            flex-wrap: wrap;
            width: 80%;
            height: fit-content;
            flex-direction: row;
            flex-shrink: 0;
            gap: 20px;
        }
        .movieList input{
            border-radius: 6px;
        }

        .movieList input:hover{
            box-shadow:  0 0 0 2px #DDEEFF;
        }
        .actorImage{
            flex: 1;            
            box-sizing: border-box;
            overflow: auto;
            text-align: center;
        }
        .actorImage p{
            color: rgb(122, 138, 152);
        }
        .actorImage img{
            border-radius: 6px;
            border: 0.5px solid rgb(54, 53, 53);
            width: 200px;
        }
        .actorImage img:hover{
            border: 0.5px solid rgb(147, 145, 145);
        }
        #bioText{
            width: fit-content;
        }
    </style>
<body>
    <p id="directorname" style="display: none;">{{directorName}}</p>
    <div class="wrapperDiv">
        <div class="movieList">
                {%for movie in movies%}
                <form action="/movie/{{ movie[1] | lower | replace(" ", "-") }}" method="post">
                <input src="{{movie[3]}}" alt="{{movie[1]}}" class="images" name="{{movie[0]}}" id="movieImages" type="image">
                <input type="hidden" name="moviename" value="{{movie[1]}}" style="display: none;">
                <input type="hidden" name="movie_id" value="{{movie[0]}}">
                </form>
                {%endfor%}
        </div>
        <div class="actorImage">
            <div style="display: flex; flex-direction: column; align-items: center;">
                <img src="{{director_image_url}}" alt="" id="actorProfile">
                <p id="bioText">{{bio_text}}</p>
            </div>
        </div>
    </div>
</body>
</html>

{% endblock %}
